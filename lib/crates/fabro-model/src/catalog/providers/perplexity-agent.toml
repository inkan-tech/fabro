[providers.perplexity-agent]
display_name = "Perplexity Agent API"
adapter = "openai"
api_key_url = "https://www.perplexity.ai/settings/api"
base_url = "https://api.perplexity.ai/v1"
priority = 41
enabled = false
aliases = ["pplx-agent"]

[providers.perplexity-agent.auth]
credentials = ["env:PERPLEXITY_API_KEY", "vault:PERPLEXITY_API_KEY"]

# Perplexity's Agent API (https://api.perplexity.ai/v1/agent) routes to
# third-party frontier models (Claude, GPT, ...) behind one Perplexity key.
# It is OpenAI **Responses**-compatible (accepts POST /v1/responses), so this
# provider uses the `openai` adapter (Responses codec), unlike the Sonar
# `perplexity` provider which is chat-completions (`openai_compatible`).
#
# Notes / caveats:
# - Shares the PERPLEXITY_API_KEY credential with the `perplexity` provider.
# - Fabro's Responses codec may probe `/responses/input_tokens` for exact
#   input-token counts. If Perplexity does not expose that endpoint, the call
#   degrades to a local estimate (InputTokenCountPreference::PreferProvider
#   falls back on eligible errors), so it is non-fatal.
# - Catalog model ids are prefixed `pplx/` to stay globally unique (the wire
#   `api_id` keeps the provider-namespaced form Perplexity expects, e.g.
#   `anthropic/claude-opus-4-8`). This avoids collisions with the native
#   `anthropic`/`openai` providers and the `openrouter` package.
# - Costs are best-effort estimates; Perplexity Agent API pricing may carry a
#   margin over the underlying provider list price. Claude rows set
#   billing_policy = "anthropic" so any reported cache tokens bill correctly.
# - Representative model set; the Agent API also exposes additional GPT-5
#   tiers, Gemini, Grok, Nemotron, and Sonar. Add rows as needed.
#
# To enable, add to ~/.fabro/settings.toml:
#
# [llm.providers.perplexity-agent]
# enabled = true
#
# Then run `fabro provider login perplexity-agent` (or set PERPLEXITY_API_KEY).

# ---------- Anthropic Claude via Perplexity Agent API ----------

[models."pplx/claude-opus-4-8"]
provider = "perplexity-agent"
api_id = "anthropic/claude-opus-4-8"
display_name = "Claude Opus 4.8 (via Perplexity)"
family = "claude-4"
billing_policy = "anthropic"
aliases = ["pplx-opus-4-8"]

[models."pplx/claude-opus-4-8".limits]
context_window = 1000000
max_output = 128000

[models."pplx/claude-opus-4-8".features]
tools = true
vision = true
reasoning = true
prompt_cache = false

[models."pplx/claude-opus-4-8".costs]
input_cost_per_mtok = 5.0
output_cost_per_mtok = 25.0
cache_input_cost_per_mtok = 0.5

